name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Test and build
        run: |
          chmod +x gradlew
          ./gradlew :app:testDebugUnitTest :app:assembleRelease --stacktrace

      # Smoke test: launch the app on an emulator and open the main screens (app/src/androidTest). If it fails,
      # the steps below don't run, so no release is published.
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      # Cold boot every time: booting from a cached AVD snapshot hung on GitHub's runners. The time limit stops a stuck
      # emulator from holding the run for hours (a timeout fails the step, so nothing is published).
      - name: Smoke test on emulator
        timeout-minutes: 25
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          arch: x86_64
          target: default
          force-avd-creation: false
          emulator-options: -no-snapshot -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          disable-animations: true
          script: ./gradlew :app:connectedDebugAndroidTest --stacktrace

      - name: Name the APK
        run: cp app/build/outputs/apk/release/app-release.apk part-stock.apk

      - uses: actions/upload-artifact@v4
        with:
          name: part-stock-apk
          path: part-stock.apk

      # A release gives a plain download link that's easy to open on a phone.
      - name: Publish release
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Part Stock build ${{ github.run_number }}
          files: part-stock.apk
          make_latest: true
