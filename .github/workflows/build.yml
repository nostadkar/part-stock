name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Test and build
        run: |
          chmod +x gradlew
          ./gradlew :app:testDebugUnitTest :app:assembleRelease --stacktrace

      # Smoke test: launch the app on an emulator and open the main screens (app/src/androidTest). If it fails,
      # the steps below don't run, so no release is published.
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      # Cold boot every time: booting from a cached AVD snapshot hung on GitHub's runners. The time limit stops a stuck
      # emulator from holding the run for hours (a timeout fails the step, so nothing is published).
      # Also takes screenshots of every screen (ScreenshotTest, #58) into /sdcard/Download/part-stock-screenshots; they
      # are pulled whether or not the tests pass, and the step then exits with the tests' own result.
      - name: Smoke test on emulator
        timeout-minutes: 35
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          arch: x86_64
          target: default
          force-avd-creation: false
          emulator-options: -no-snapshot -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          disable-animations: true
          # Line 1: the smoke tests on their own (their result is the step's result). Line 2: the screenshots in a
          # separate run, so they can't disturb the smoke tests and never fail the build. Then pull, log, exit.
          script: |
            ./gradlew :app:connectedDebugAndroidTest --stacktrace -Pandroid.testInstrumentationRunnerArguments.notClass=com.partstock.scanner.ScreenshotTest; echo $? > smoke-exit.txt
            timeout 900 ./gradlew :app:connectedDebugAndroidTest -Pandroid.testInstrumentationRunnerArguments.class=com.partstock.scanner.ScreenshotTest || echo "Screenshot run failed (ignored)"
            timeout 120 adb pull /sdcard/Download/part-stock-screenshots . || echo "No screenshots pulled"
            ls part-stock-screenshots || true
            adb logcat -d -s PartStockShots | tail -n 150 || true
            exit $(cat smoke-exit.txt)

      # Screenshots for checking GUI changes by eye; a problem here never fails the build.
      - name: Upload screenshots
        id: shots
        if: always()
        continue-on-error: true
        timeout-minutes: 5
        uses: actions/upload-artifact@v4
        with:
          name: screenshots
          path: part-stock-screenshots/
          retention-days: 14
          if-no-files-found: warn

      - name: Screenshots link in the run summary
        if: always()
        continue-on-error: true
        env:
          SHOTS_URL: ${{ steps.shots.outputs.artifact-url }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          n=$(ls part-stock-screenshots/*.png 2>/dev/null | wc -l)
          if [ -n "$SHOTS_URL" ]; then
            echo "### Screenshots: $n PNGs ([download]($SHOTS_URL))" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "### Screenshots: none uploaded (run: $RUN_URL)" >> "$GITHUB_STEP_SUMMARY"
          fi
          ls part-stock-screenshots 2>/dev/null | sed 's/^/- /' >> "$GITHUB_STEP_SUMMARY" || true

      - name: Name the APK
        run: cp app/build/outputs/apk/release/app-release.apk part-stock.apk

      - uses: actions/upload-artifact@v4
        with:
          name: part-stock-apk
          path: part-stock.apk

      # A release gives a plain download link that's easy to open on a phone.
      - name: Publish release
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Part Stock build ${{ github.run_number }}
          # The commit message becomes the release notes the in-app update dialog shows.
          body: ${{ github.event.head_commit.message }}
          files: part-stock.apk
          make_latest: true
